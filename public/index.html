<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fb" />
    <meta name="description" content="按周一至周五计算全年出勤日的简洁日历。" />
    <title>全年出勤日历</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <div class="eyebrow"><span class="eyebrow-dot"></span>工作日规划工具</div>
        <div class="hero-row">
          <div>
            <h1>全年出勤日历</h1>
            <p>一眼查看每个月的工作日，轻松规划全年节奏。</p>
          </div>
          <div class="year-control">
            <label for="yearSelect">查看年份</label>
            <div class="select-wrap">
              <select id="yearSelect" aria-label="选择年份"></select>
              <span aria-hidden="true">⌄</span>
            </div>
          </div>
        </div>
      </header>

      <section class="summary" aria-labelledby="summary-title">
        <div class="summary-heading">
          <div>
            <span class="section-kicker">年度概览</span>
            <h2 id="summary-title"><span id="summaryYear"></span>年出勤概览</h2>
          </div>
          <span class="workday-pill"><span class="legend-dot workday"></span>周一至周五计为出勤</span>
        </div>
        <div class="summary-grid">
          <div class="summary-item primary">
            <span class="summary-label">全年出勤日</span>
            <strong id="annualWorkdays">—</strong><span class="summary-unit">天</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">全年总天数</span>
            <strong id="annualDays">—</strong><span class="summary-unit">天</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">周末休息日</span>
            <strong id="annualWeekends">—</strong><span class="summary-unit">天</span>
          </div>
        </div>
      </section>

      <section class="calendar-section" aria-labelledby="calendar-title">
        <div class="section-heading">
          <div>
            <span class="section-kicker">全年日历</span>
            <h2 id="calendar-title">每月出勤详情</h2>
          </div>
          <div class="legend" aria-label="日历图例">
            <span><i class="legend-dot workday"></i>出勤日</span>
            <span><i class="legend-dot weekend"></i>周末</span>
          </div>
        </div>
        <div id="monthGrid" class="month-grid" aria-live="polite"></div>
      </section>

      <footer>仅按星期计算，不含法定节假日及调休安排</footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
